[package]
name = "sift-gate"
version = "0.1.0"
edition = "2024"
description = "Configurable routing for AI provider APIs"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
toml = "1"
